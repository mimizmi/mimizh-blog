name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # git log 要看到完整历史才能给每个文件算出真实的最后提交时间；
          # 默认的 fetch-depth: 1 会让所有文件共享同一个 commit 时间。
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # frontmatter / 类型出错时直接让 CI 红，而不是静默产出空白页
      - run: npm run check
      # 字体子集覆盖率护栏：写了新字忘了重跑 npm run fonts 时让 CI 红
      - run: npm run verify
      # fetch-depth 一旦被后续修改回默认值（浅克隆），这一步会立刻让 CI 红
      - run: npm run check:dates
      - run: npm run build
      - run: npm run verify:dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
